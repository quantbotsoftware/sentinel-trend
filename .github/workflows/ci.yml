name: CI

# Runs on every push / PR to main. No secrets, no broker calls, no telemetry.
# ~1,700 unit + integration tests (strategy engine, FSM, exec adversarial cases, P&L decimal parity, snapshots).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  frontend:
    name: Frontend ES-module syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ES-module syntax validation
        run: |
          count=0; fail=0
          while IFS= read -r -d '' f; do
            case "$f" in */lightweight-charts.js) continue;; esac
            if node --input-type=module --check < "$f"; then count=$((count+1)); else echo "::error file=$f::syntax error"; fail=$((fail+1)); fi
          done < <(find src -type f -name '*.js' -print0)
          echo "Checked $count JS modules, $fail failures"
          [ "$fail" -eq 0 ]

  rust:
    name: Rust build & tests (Tauri v2, Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri v2 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev pkg-config patchelf
      - name: cargo test --workspace --locked
        working-directory: src-tauri
        run: cargo test --workspace --locked
